<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Take our comprehensive skin analysis quiz and get a personalized treatment plan from Bestie Beauty Bar." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
    <title>Skin Analysis | Bestie Beauty Bar</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden form for Netlify Forms detection -->
    <form name="skin-analysis-leads" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="age" />
      <input type="text" name="fitzpatrick" />
      <input type="text" name="skin_type" />
      <input type="text" name="skin_quality" />
      <input type="text" name="upper_face" />
      <input type="text" name="mid_face" />
      <input type="text" name="lower_face" />
      <input type="text" name="hair_scalp" />
      <input type="text" name="lifestyle" />
      <input type="text" name="skincare_routine" />
      <input type="text" name="spf" />
      <input type="text" name="experience" />
      <input type="text" name="weight_goal" />
      <input type="text" name="priorities" />
      <input type="text" name="budget" />
      <input type="text" name="contact" />
      <input type="text" name="skin_score" />
      <input type="text" name="recommended_services" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
